<div class="account-shell">
  <section class="account-shell__content">
    <app-nav-back
      [fallbackLink]="financeBackLink"
      fallbackLabel="Finance">
    </app-nav-back>

    <na-list-dashboard
      [config]="config"
      [refData]="refData"
      [routeContext]="routeContext"
      [formContext]="{
        dashboardId: 'finance.accounts',
        refData: refData,
        data: routeContext
      }"
      (notification)="onNotification($event)"
      (createComplete)="onAccountCreated()">
    </na-list-dashboard>
  </section>
</div>
