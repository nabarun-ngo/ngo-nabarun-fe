<div class="dash-root">

  <!-- ── 1. Plain greeting ─────────────────────────────────── -->
  <div class="dash-greeting">
    <p class="dash-greeting__sub">Welcome back</p>
    <p class="dash-greeting__name">{{ displayName | titlecase }}</p>
  </div>

  <!-- ── 2. Overview metrics (2 cols mobile · 4 cols desktop) ─ -->
  <section class="dash-kpi-section dash-surface">
    <div class="dash-section-hdr dash-section-hdr--inset dash-section-hdr--with-action">
      <span class="dash-section-hdr__title">Your Overview</span>
      <button (click)="reload()" class="dash-icon-btn dash-icon-btn--sm" title="Refresh overview" aria-label="Refresh overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
      </button>
    </div>

    <div class="dash-surface__body">
      <app-dash-overview-panel [tiles]="overviewTiles"></app-dash-overview-panel>
    </div>
  </section>

  <!-- ── 3. Quick access (3 cols mobile · 6 cols desktop) ─── -->
  <section class="dash-qa-section dash-surface">
    <div class="dash-section-hdr dash-section-hdr--inset">
      <span class="dash-section-hdr__title">Quick Access</span>
    </div>

    <div class="dash-surface__body">
      <div class="qa-search">
        <svg class="qa-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          class="qa-search__input"
          placeholder="Search quick access..."
          [(ngModel)]="quickAccessSearch"
          aria-label="Search quick access" />
        <button
          *ngIf="quickAccessSearch"
          type="button"
          class="qa-search__clear"
          (click)="clearQuickAccessSearch()"
          aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <app-nav-tile-grid
        [tiles]="accessNavTiles"
        variant="access"
        layout="access"
        emptyMessage="No shortcuts match your search.">
      </app-nav-tile-grid>
    </div>
  </section>

</div>
