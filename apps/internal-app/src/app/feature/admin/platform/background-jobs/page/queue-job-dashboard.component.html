<div class="admin-list-shell">
  <section class="admin-list-shell__content">
    <app-nav-back [fallbackLink]="adminBackLink" fallbackLabel="Admin"></app-nav-back>

    <app-queue-stats-card
      [overview]="overview"
      [loading]="overviewLoading"
      [canManageQueue]="permissions.canManageQueue"
      [canClean]="permissions.canClean"
      (refresh)="onRefresh()"
      (pause)="onPause()"
      (resume)="onResume()"
      (clearOldJobs)="onClearOldJobs()">
    </app-queue-stats-card>

    <na-list-dashboard
      [config]="config"
      (notification)="onNotification($event)">
    </na-list-dashboard>
  </section>
</div>
