<div class="request-shell">
  <section class="request-shell__content">
    <app-nav-back
      [fallbackLink]="homeBackLink"
      fallbackLabel="Dashboard">
    </app-nav-back>

    <na-list-dashboard
      [config]="config"
      [refData]="refData"
      [routeContext]="routeContext"
      [formContext]="{
        dashboardId: 'workflow-request',
        refData: refData,
        data: routeContext
      }"
      (notification)="onNotification($event)">
    </na-list-dashboard>
  </section>
</div>
