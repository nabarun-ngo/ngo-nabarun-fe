<div class="goal-shell">
  <section class="goal-shell__content">
    <app-nav-back
      [fallbackLink]="hubBackLink"
      fallbackLabel="Projects">
    </app-nav-back>

    <na-list-dashboard
      [config]="config"
      [refData]="refData"
      [routeContext]="routeContext"
      [formContext]="{
        dashboardId: 'goal-list',
        refData: refData,
        data: routeContext
      }"
      (notification)="onNotification($event)">
    </na-list-dashboard>
  </section>
</div>
