<div class="book-shell">
  <section class="book-shell__content">
    <app-nav-back
      [fallbackLink]="hubBackLink"
      fallbackLabel="Assets">
    </app-nav-back>

    <na-list-dashboard
      [config]="config"
      [refData]="refData"
      [routeContext]="routeContext"
      [formContext]="{
        dashboardId: 'book-list',
        refData: refData,
        data: routeContext
      }"
      (notification)="onNotification($event)">
    </na-list-dashboard>
  </section>
</div>
