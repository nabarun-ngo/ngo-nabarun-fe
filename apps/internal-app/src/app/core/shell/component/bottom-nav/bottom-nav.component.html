<!-- More menu backdrop + sheet -->
<div
  *ngIf="moreMenuOpen"
  class="more-menu-backdrop"
  (click)="closeMoreMenu()"
  aria-hidden="true">
</div>

<div
  *ngIf="moreMenuOpen"
  class="more-menu"
  role="dialog"
  aria-label="More options">

  <div class="more-menu__handle" aria-hidden="true"></div>

  <div class="more-menu__title-row">
    <h2 class="more-menu__title">More</h2>
    <button
      type="button"
      class="more-menu__close"
      (click)="closeMoreMenu()"
      aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="more-menu__grid">
    <ng-container *ngFor="let item of moreMenuItems">
      <button
        *ngIf="item.action === 'logout'"
        type="button"
        class="more-menu__item more-menu__item--danger"
        id="logout"
        (click)="onMoreItemClick(item)">
        <span class="more-menu__icon-wrap">
          <svg class="more-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="item.icon"></path>
          </svg>
        </span>
        <span class="more-menu__label">{{ item.label }}</span>
      </button>

      <a
        *ngIf="!item.action"
        class="more-menu__item"
        [routerLink]="item.url"
        (click)="closeMoreMenu()"
        [class.more-menu__item--active]="isMoreItemActive(item)">
        <span class="more-menu__icon-wrap">
          <svg class="more-menu__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path [attr.d]="item.icon"></path>
          </svg>
        </span>
        <span class="more-menu__label">{{ item.label }}</span>
      </a>
    </ng-container>
  </div>
</div>

<nav class="bottom-nav" aria-label="Main navigation">
  <a
    *ngFor="let item of primaryItems"
    class="bottom-nav__tab"
    [class.bottom-nav__tab--active]="isTabActive(item)"
    [routerLink]="item.url"
    [attr.aria-label]="item.label"
    [attr.aria-current]="isTabActive(item) ? 'page' : null">

    <span class="bottom-nav__icon-wrap">
      <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path [attr.d]="item.icon"></path>
      </svg>
      <span
        class="bottom-nav__indicator"
        [class.bottom-nav__indicator--show]="isTabActive(item)">
      </span>
    </span>
    <span class="bottom-nav__label">{{ item.label }}</span>
  </a>

  <button
    *ngIf="moreMenuItems.length"
    type="button"
    class="bottom-nav__tab"
    [class.bottom-nav__tab--active]="isMoreTabActive()"
    aria-label="More"
    [attr.aria-expanded]="moreMenuOpen"
    (click)="toggleMoreMenu($event)">

    <span class="bottom-nav__icon-wrap">
      <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
      </svg>
      <span
        class="bottom-nav__indicator"
        [class.bottom-nav__indicator--show]="isMoreTabActive()">
      </span>
    </span>
    <span class="bottom-nav__label">More</span>
  </button>
</nav>
