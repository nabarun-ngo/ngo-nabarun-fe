<ng-container [ngSwitch]="icon">
  <!-- Finance hub / KPI finance icons. Glyphs are drawn inside a 3–21 box so
       every icon reads at the same optical size. -->
  <svg *ngSwitchCase="'donations'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"></line>
    <path d="M16.5 6.5H10a3.25 3.25 0 0 0 0 6.5h4a3.25 3.25 0 0 1 0 6.5H7"></path>
  </svg>
  <svg *ngSwitchCase="'donors'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V21"></path>
    <circle cx="9.5" cy="7.5" r="3.5"></circle>
    <path d="M21 21v-1.5a4 4 0 0 0-3-3.87"></path>
    <path d="M15.5 4.2a4 4 0 0 1 0 7.6"></path>
  </svg>
  <svg *ngSwitchCase="'accounts'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
    <line x1="3" y1="10" x2="21" y2="10"></line>
  </svg>
  <svg *ngSwitchCase="'earnings'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="12" width="4.5" height="8" rx="1"></rect>
    <rect x="9.75" y="6" width="4.5" height="14" rx="1"></rect>
    <rect x="16" y="9" width="4.5" height="11" rx="1"></rect>
  </svg>
  <svg *ngSwitchCase="'expenses'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="10.5" width="18" height="10.5" rx="2" ry="2"></rect>
    <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
  </svg>
  <svg *ngSwitchCase="'reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"></path>
    <polyline points="13.5 3 13.5 8.5 19 8.5"></polyline>
    <line x1="8.5" y1="13.5" x2="14.5" y2="13.5"></line>
    <line x1="8.5" y1="17" x2="14.5" y2="17"></line>
  </svg>

  <!-- Project hub icons. Same 3–21 optical box as the finance glyphs. -->
  <svg *ngSwitchCase="'projects'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4.5l1.8 2.6H19a2 2 0 0 1 2 2z"></path>
  </svg>
  <svg *ngSwitchCase="'activities'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="16" rx="2"></rect>
    <line x1="8" y1="3" x2="8" y2="6"></line>
    <line x1="16" y1="3" x2="16" y2="6"></line>
    <polyline points="8.5 13 11 15.5 15.5 11"></polyline>
  </svg>
  <svg *ngSwitchCase="'goals'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"></circle>
    <circle cx="12" cy="12" r="4.5"></circle>
    <circle cx="12" cy="12" r="1"></circle>
  </svg>
  <svg *ngSwitchCase="'beneficiaries'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7.5" r="3.5"></circle>
    <path d="M5 21v-1.5a4.5 4.5 0 0 1 4.5-4.5h5A4.5 4.5 0 0 1 19 19.5V21"></path>
  </svg>
  <svg *ngSwitchCase="'milestones'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="3" x2="6" y2="21"></line>
    <path d="M6 4.5h12l-2.5 4 2.5 4H6"></path>
  </svg>
  <svg *ngSwitchCase="'team'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3"></circle>
    <path d="M3 20v-1.5A3.5 3.5 0 0 1 6.5 15h5a3.5 3.5 0 0 1 3.5 3.5V20"></path>
    <path d="M16.5 5.5a3 3 0 0 1 0 5.8"></path>
    <path d="M18 15.3A3.5 3.5 0 0 1 21 18.7V20"></path>
  </svg>
  <svg *ngSwitchCase="'risks'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4.2 21 19.5H3z"></path>
    <line x1="12" y1="10" x2="12" y2="14.5"></line>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </svg>

  <!-- Quick access icons -->
  <svg *ngSwitchCase="'icon_rupee'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 8h6m-5 0a3 3 0 1 1 0 6H9l3 3m-3-6h6m6 1a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
  </svg>
  <svg *ngSwitchCase="'icon_book'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
  </svg>
  <svg *ngSwitchCase="'icon_expense'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <svg *ngSwitchCase="'icon_tasks'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
    <rect x="9" y="3" width="6" height="4" rx="2"/>
    <path d="M9 12l2 2 4-4"/>
  </svg>
  <svg *ngSwitchCase="'icon_members'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
  <svg *ngSwitchCase="'icon_requests'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  </svg>
  <svg *ngSwitchCase="'icon_meetings'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
    <line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8" y1="2" x2="8" y2="6"/>
    <line x1="3" y1="10" x2="21" y2="10"/>
  </svg>
  <svg *ngSwitchCase="'icon_projects'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
  </svg>
  <svg *ngSwitchCase="'icon_admin'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
  <svg *ngSwitchCase="'icon_help'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </svg>

  <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"></circle>
  </svg>
</ng-container>
