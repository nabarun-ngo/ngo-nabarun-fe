<div class="kpi-panel">
  <ng-container *ngFor="let tile of tiles">
    <a
      [routerLink]="tile.link"
      [queryParams]="tile.queryParams ?? null"
      class="kpi-card"
      [class.kpi-card--alert]="tile.metric?.showBadge"
      [attr.id]="tile.id">

      <div class="kpi-icon-wrap" [ngSwitch]="tile.id">
        <svg *ngSwitchCase="'donationTile'" class="kpi-svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <svg *ngSwitchCase="'accountTile'" class="kpi-svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <svg *ngSwitchCase="'expenseTile'" class="kpi-svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <svg *ngSwitchCase="'worklistTile'" class="kpi-svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <svg *ngSwitchDefault class="kpi-svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
      </div>

      <p class="kpi-label">{{ tile.metric?.label }}</p>

      <p class="kpi-value">
        <span *ngIf="tile.metric?.loading" class="kpi-shimmer"></span>
        <span *ngIf="!tile.metric?.loading">
          {{ tile.metric?.value || '—' }}
        </span>
      </p>

      <span *ngIf="tile.metric?.showBadge" class="kpi-dot"></span>
    </a>
  </ng-container>
</div>
