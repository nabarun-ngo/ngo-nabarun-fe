<section class="line-items-editor">
  <div class="line-items-editor__header">
    <h3 class="line-items-editor__title">Expense Items</h3>
    <button
      type="button"
      class="app-btn app-btn--ghost line-items-editor__add-btn"
      (click)="addRow()">
      Add item
    </button>
  </div>

  <div
    class="line-items-editor__row"
    *ngFor="let item of rows; let index = index; trackBy: trackRow">
    <div class="line-items-editor__row-header">
      <span class="line-items-editor__row-label">Item {{ index + 1 }}</span>
      <button
        type="button"
        class="app-btn app-btn--ghost line-items-editor__remove-btn"
        aria-label="Remove item"
        [disabled]="rows.length <= minRows"
        (click)="removeRow(index)">
        Remove
      </button>
    </div>

    <div class="line-items-editor__fields">
      <label class="line-items-editor__field">
        <span>Item name</span>
        <input
          type="text"
          [value]="item.itemName"
          placeholder="Ex. Tea / Coffee"
          autocomplete="off"
          (input)="onItemChange(index, 'itemName', $any($event.target).value)">
      </label>
      <label class="line-items-editor__field line-items-editor__field--amount">
        <span>Amount</span>
        <input
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          [value]="item.amount || ''"
          placeholder="0.00"
          (input)="onItemChange(index, 'amount', $any($event.target).value)">
      </label>
    </div>
  </div>
</section>
