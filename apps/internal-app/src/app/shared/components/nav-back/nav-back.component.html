<a
  class="app-nav-back"
  [attr.href]="link"
  [attr.aria-label]="'Back to ' + label"
  (click)="onClick($event)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
  <span>{{ label }}</span>
</a>
